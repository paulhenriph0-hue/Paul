# Alternative Projektdefinition für XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Nur nötig, falls FitTrack.xcodeproj sich nicht öffnen lässt (z. B. mit Xcode 15):
#   brew install xcodegen && xcodegen generate
# Achtung: Das überschreibt FitTrack.xcodeproj.
name: FitTrack
options:
  bundleIdPrefix: com.example
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FitTrack:
    type: application
    platform: iOS
    sources:
      - FitTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FitTrack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: FitTrack
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ENABLE_PREVIEWS: YES
  FitTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FitTrackTests
    dependencies:
      - target: FitTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.FitTrackTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FitTrack:
    build:
      targets:
        FitTrack: all
        FitTrackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FitTrackTests
